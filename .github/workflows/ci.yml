name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: node-ci

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install workspace deps (for @typescript/native-preview + detect-libc)
        run: pnpm install --frozen-lockfile

      - name: Run Node integration tests
        run: pnpm test:node

  license:
    name: Dependency licenses + advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Runs all four cargo-deny checks against deny.toml:
      #   licenses   - only the allow-listed SPDX licenses may appear
      #   advisories - known RUSTSEC vulnerabilities. Exceptions live in the
      #                `[advisories] ignore` list, each with the reason it does
      #                not apply to us.
      #   bans       - no wildcard deps; duplicate versions warn only
      #   sources    - crates must come from crates.io
      - name: Check dependency licenses, advisories, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  license-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Verifies every first-party source file carries the Apache 2.0 header.
      # Self-contained Node script (no extra install). Run `pnpm license:fix`
      # locally to add missing headers.
      - name: Check Apache license headers
        run: node scripts/license-header.mjs check

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build
