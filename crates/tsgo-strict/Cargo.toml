[package]
name = "tsgo-strict"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
# Not published to crates.io: the crate names are unreserved and the public
# surface is the npm packages. Guards against an accidental `cargo publish`.
publish = false

[[bin]]
name = "tsgo-strict"
path = "src/main.rs"

[dependencies]
tsgo-strict-core = { path = "../tsgo-strict-core" }
anyhow.workspace = true
clap.workspace = true
camino.workspace = true
